# SecureChat TLS reverse proxy template.
#
# External clients connect to:
#   wss://chat.la5te2.online:25566
#
# Nginx terminates ordinary TLS and proxies WebSocket traffic to the local
# SecureChat Server backend:
#   ws://127.0.0.1:25567
#
# The SecureChat Server should be started as:
#   SECURECHAT_BIND_ADDRESS=127.0.0.1 SECURECHAT_PORT=25567 ./start_server.sh --mode ws

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 25566 ssl;
    server_name chat.la5te2.online;

    ssl_certificate /opt/SecureChat/certs/fullchain.pem;
    ssl_certificate_key /opt/SecureChat/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://127.0.0.1:25567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
